<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}</style></head><body>
<title>Blockplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: Werkbank – Datei-Leiste oben, Texturen-Leiste, Kennzahlen, dann Arbeitsfläche mit Tabs (Material / Rohstoffe / Schichten / 3D) */
:root{
  --bg:#eceeed; --surface:#ffffff; --sunken:#f4f6f5; --ink:#1c2321; --muted:#5d6a66; --line:#d3dad7;
  --accent:#2a8571; --accent-soft:#d8ece6; --accent-ink:#ffffff; --copper:#b4613b; --ok:#2f8a4c; --ghost:#9aa6a2; --sky:#cfe0e6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131817; --surface:#1b2221; --sunken:#171d1c; --ink:#e3eae7; --muted:#92a09b; --line:#2c3634;
  --accent:#4cb398; --accent-soft:#1e3a33; --accent-ink:#0d1513; --copper:#d8875f; --ok:#5cc07a; --ghost:#55625e; --sky:#1c272a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131817; --surface:#1b2221; --sunken:#171d1c; --ink:#e3eae7; --muted:#92a09b; --line:#2c3634;
  --accent:#4cb398; --accent-soft:#1e3a33; --accent-ink:#0d1513; --copper:#d8875f; --ok:#5cc07a; --ghost:#55625e; --sky:#1c272a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.readout:empty{display:none}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
header.top p{margin:4px 0 0;max-width:62ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.drop{border:2px dashed var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .label{flex:1 1 260px;min-width:0}
.drop strong{font-family:var(--f-display);font-size:17px}
.btn{border:1px solid var(--line);background:var(--sunken);border-radius:7px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13px}
.file-name{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.badge.example{background:color-mix(in srgb,var(--copper) 18%,transparent);color:var(--copper)}
.err{color:var(--copper);font-weight:500}

.texbar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.texbar .txt{flex:1 1 320px;min-width:0;font-size:14px}
.texbar code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 6px;word-break:break-all}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ghost);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--ok)}

.builds{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.bhead strong{font-family:var(--f-display);font-size:16px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.brow .bname{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.brow.current .bname::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:2px}
.bprog{width:110px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bprog .bar{height:6px}
.bbtns{display:flex;gap:6px}
@media (max-width:560px){.brow{grid-template-columns:1fr auto}.bprog{grid-column:1/-1;width:100%}}
.live{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.lvhead strong{font-family:var(--f-display);font-size:16px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lvbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvbox .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lvcounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.lvcounts b{font-family:var(--f-mono);font-weight:500}
.lvwrong{display:flex;flex-direction:column;max-height:260px;overflow:auto;font-size:13px;margin-top:6px}
.lvwrong div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line);align-items:center}
.lvwrong .mono{white-space:nowrap}
#lvWrongSum{cursor:pointer;font-weight:600;font-size:14px;color:var(--copper)}
.coord select{background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.paste{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.paste textarea{width:100%;min-height:150px;resize:vertical;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px;font-family:var(--f-mono);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}

.progress{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.progress{grid-template-columns:1fr}}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pbox .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pbox .pct{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--sunken);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.copper>i{background:var(--copper)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:12px}

.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tools input[type=search]{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.tools label{display:flex;gap:6px;align-items:center;font-size:14px}

.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:inline-block;width:18px;height:18px;border-radius:2px;vertical-align:-4px;margin-right:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);background-size:cover;image-rendering:pixelated;flex:none}
.name{min-width:170px}
tr.done td{color:var(--muted)}
tr.done .nm{text-decoration:line-through;text-decoration-color:var(--ghost)}
.have{width:84px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:4px 6px;text-align:right;font-family:var(--f-mono)}
.mini{width:70px;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini>i{display:block;height:100%;background:var(--ok)}
.chk{font-size:13px;color:var(--ok);font-weight:600;white-space:nowrap}
.note{font-size:13px;color:var(--muted);max-width:75ch;margin:0}

.layers{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.objwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.objside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:82vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ocat summary{cursor:pointer;display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em;padding:4px 2px}
.ocat summary .cnt{color:var(--muted);font-family:var(--f-mono);font-weight:400}
.oitem{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:4px 8px;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.oitem:hover{background:var(--sunken)}.oitem.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.oitem .tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.objmain{min-width:0;display:flex;flex-direction:column;gap:10px}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}.ohead h3{margin:0;font-family:var(--f-display);font-size:22px}
.onote{margin:0;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.onote a{color:var(--accent)}
.ogrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.ostage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.oview{position:relative;height:min(62vh,640px);min-height:300px;background:var(--sunken);border-radius:6px;overflow:hidden;touch-action:none}
.oview canvas{display:block;width:100%;height:100%}
.lbs{display:flex;flex-wrap:wrap;gap:3px}.lbs .lb{min-width:28px;padding:2px 6px;border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:5px;font:12px var(--f-mono);cursor:pointer}
.lbs .lb.on{background:#e0559a;border-color:#e0559a;color:#fff}
.oside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:82vh;overflow:auto}
.oside h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.omat{width:100%;border-collapse:collapse;font-size:13px}.omat .st{font-size:11px;white-space:nowrap}.omat td{padding:2px 4px;border-bottom:1px solid var(--line)}.omat .num{text-align:right;font-family:var(--f-mono)}
.olive{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.ohint{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px}
.small{font-size:12.5px}
.objform{position:absolute;right:10px;top:10px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);width:240px}
.objform label{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:center}.objform input{width:130px}
.objhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,20,20,.75);color:#fff;font-size:13px;padding:4px 10px;border-radius:6px;pointer-events:none}
@media (max-width:860px){.objwrap,.ogrid{grid-template-columns:1fr}.objside{max-height:none}}
@media (max-width:860px){.layers{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.layernav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.layernav input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent)}
.layernav .y{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.canvasbox{position:relative;overflow:auto;max-height:70vh;background:var(--sunken);border-radius:6px;display:flex;justify-content:center;align-items:flex-start;padding:8px}
canvas{image-rendering:pixelated;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;font-family:var(--f-mono);z-index:2}
.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;max-height:78vh;overflow:auto}
.side h3{font-size:16px}
.lm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.lm:last-child{border-bottom:0}
.lm span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.built{display:flex;align-items:center;gap:8px;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

.view3d{position:relative;height:min(72vh,720px);min-height:320px;background:#78a7ff;border-radius:6px;overflow:hidden;touch-action:none;cursor:grab}
.view3d canvas{width:100%;height:100%;image-rendering:auto}
.view3d .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;text-align:center;padding:20px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.view3d .tip{top:12px;left:12px}
.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.cross::before{left:8px;top:0;width:2px;height:18px}.cross::after{top:8px;left:0;height:2px;width:18px}
.v3read,.v3help{position:absolute;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:3px 9px;border-radius:4px;pointer-events:none}
.v3read{left:10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.v3help{right:10px;max-width:55%;text-align:right}
@media (max-width:700px){.v3help{display:none}}
.plan{position:relative;height:min(70vh,760px);min-height:320px;background:var(--sunken);border-radius:6px;overflow:hidden;touch-action:none;cursor:grab}
.plan canvas{width:100%;height:100%}
.plan.measuring{cursor:crosshair}
.mlabel{position:absolute;transform:translateX(-50%);pointer-events:none;background:var(--copper);color:#fff;font:12px var(--f-mono);padding:3px 8px;border-radius:5px;white-space:nowrap}
.readout{position:absolute;left:46px;bottom:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:2px 8px;border-radius:4px;font-size:12px;pointer-events:none}
.coord{font-family:var(--f-mono)}
.coord input{width:90px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-family:var(--f-mono)}
.tools input[type=range]{accent-color:var(--accent);width:120px}
.kb summary{cursor:pointer;font-weight:600;font-size:14px}
.kbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;margin-top:8px}
.kbrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.kbrow .btn{min-width:110px;font-family:var(--f-mono)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage:fullscreen{border-radius:0;padding:12px;overflow:auto}
.stage:fullscreen .view3d,.stage:fullscreen .plan{height:calc(100vh - 170px)}
footer.foot{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Blockplan</h1>
      <p class="muted" data-i18n="sub"></p>
    </div>
    <div class="seg" role="group" aria-label="Sprache / Language">
      <button id="langDe" aria-pressed="true">DE</button><button id="langEn" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="drop" id="drop">
    <div class="label">
      <strong data-i18n="dropTitle"></strong>
      <div class="muted" style="font-size:14px" data-i18n="dropHint"></div>
      <div id="status" style="margin-top:6px"></div>
    </div>
    <div class="row">
      <input type="file" id="file" accept=".litematic,.schem,.schematic,.nbt" hidden>
      <button class="btn primary" id="pick" data-i18n="pick"></button>
      <button class="btn" id="pasteBtn" data-i18n="paste"></button>
      <button class="btn" id="worldBtn" data-i18n="worldBtn"></button>
      <button class="btn" id="sampleBtn" data-i18n="sample"></button>
    </div>
  </section>

  <section class="live" id="livePanel" hidden>
    <div class="lvhead"><span class="dot" id="lvDot"></span><strong data-i18n="lvTitle"></strong> <span class="muted" id="lvState"></span></div>
    <div class="lvgrid">
      <div class="lvbox">
        <div class="k" data-i18n="lvPlan"></div>
        <div id="lvPlan" class="muted"></div>
        <div class="row"><button class="btn primary small" id="lvSend" data-i18n="lvSend"></button><span id="lvSendMsg" style="font-size:13px"></span></div>
      </div>
      <div class="lvbox">
        <div class="k" data-i18n="lvPlace"></div>
        <div class="row">
          <label class="coord">X <input type="number" id="anX"></label><label class="coord">Y <input type="number" id="anY"></label><label class="coord">Z <input type="number" id="anZ"></label>
          <label class="coord"><span data-i18n="lvRot"></span> <select id="anR"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label>
        </div>
        <div class="row"><span class="muted" style="font-size:13px" data-i18n="lvCenter"></span>
          <label class="coord">X <input type="number" id="ceX"></label><label class="coord">Z <input type="number" id="ceZ"></label>
          <button class="btn small" id="ceGo" data-i18n="lvFromCenter"></button></div>
        <div class="row"><button class="btn primary small" id="anSave" data-i18n="lvSavePlace"></button><span id="anMsg" style="font-size:13px"></span></div>
      </div>
      <div class="lvbox">
        <div class="k" data-i18n="lvProgress"></div>
        <div id="lvCounts" class="lvcounts"></div>
        <div class="k" style="margin-top:6px" data-i18n="lvPlayers"></div>
        <div id="lvPlayers" class="muted" style="font-size:13px"></div>

<script>
/*PARSER-START*/
function gunzipMaybe(u8){ return (u8[0]===0x1f && u8[1]===0x8b) ? pako.ungzip(u8) : u8; }
function E(code,arg){const e=new Error(code);e.code=code;e.arg=arg;return e;}
function parseNBT(buf){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength); let p=0; const td=new TextDecoder();
  function str(){const l=dv.getUint16(p);p+=2;const s=td.decode(buf.subarray(p,p+l));p+=l;return s;}
  function pl(t){switch(t){
    case 1:{const v=dv.getInt8(p);p+=1;return v;}
    case 2:{const v=dv.getInt16(p);p+=2;return v;}
    case 3:{const v=dv.getInt32(p);p+=4;return v;}
    case 4:{const hi=dv.getInt32(p),lo=dv.getUint32(p+4);p+=8;return hi*4294967296+lo;}
    case 5:{const v=dv.getFloat32(p);p+=4;return v;}
    case 6:{const v=dv.getFloat64(p);p+=8;return v;}
    case 7:{const l=dv.getInt32(p);p+=4;const v=buf.subarray(p,p+l);p+=l;return v;}
    case 8:return str();
    case 9:{const et=dv.getUint8(p);p+=1;const l=dv.getInt32(p);p+=4;const a=[];for(let i=0;i<l;i++)a.push(pl(et));return a;}
    case 10:{const o={};for(;;){const tt=dv.getUint8(p);p+=1;if(tt===0)break;const n=str();o[n]=pl(tt);}return o;}
    case 11:{const l=dv.getInt32(p);p+=4;const a=new Int32Array(l);for(let i=0;i<l;i++){a[i]=dv.getInt32(p);p+=4;}return a;}
    case 12:{const l=dv.getInt32(p);p+=4;const w=new Uint32Array(l*2);for(let i=0;i<l;i++){w[2*i+1]=dv.getUint32(p);w[2*i]=dv.getUint32(p+4);p+=8;}return {longWords:w,length:l};}
    default: throw E('errNbt');
  }}
  const t=dv.getUint8(p);p+=1; if(t!==10) throw E('errNotSchem');
  str(); return pl(10);
}
function parseState(s){
  const i=s.indexOf('['); const name=i<0?s:s.slice(0,i); const props={};
  if(i>=0){ s.slice(i+1,s.lastIndexOf(']')).split(',').forEach(kv=>{const [k,v]=kv.split('=');if(k)props[k.trim()]=(v||'').trim();}); }
  return {name, props};
}
function stateKey(name,props){const ks=Object.keys(props||{}).sort();return name+(ks.length?'['+ks.map(k=>k+'='+props[k]).join(',')+']':'');}
function makeBuilder(sx,sy,sz){
  if(sx*sy*sz>260e6) throw E('errTooBig',sx+'×'+sy+'×'+sz);
  const palette=[{name:'minecraft:air',props:{}}]; const map=new Map([['minecraft:air',0]]);
  return {sx,sy,sz,palette,data:new Uint16Array(sx*sy*sz),
    id(name,props){props=props||{};if(!name.includes(':'))name='minecraft:'+name;const k=stateKey(name,props);let v=map.get(k);if(v===undefined){v=palette.length;palette.push({name,props});map.set(k,v);}return v;}};
}
function readLitematic(root){
  const regs=Object.values(root.Regions||{}); if(!regs.length) throw E('errNoRegions');
  let mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  const info=regs.map(r=>{const P=[r.Position.x,r.Position.y,r.Position.z],S=[r.Size.x,r.Size.y,r.Size.z];
    const lo=P.map((p,i)=>p+(S[i]<0?S[i]+1:0)); const A=S.map(Math.abs);
    for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],lo[i]);mx[i]=Math.max(mx[i],lo[i]+A[i]);}
    return {r,lo,A};});
  const B=makeBuilder(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);
  for(const {r,lo,A} of info){
    const pal=r.BlockStatePalette.map(e=>B.id(e.Name,e.Properties||{}));
    const bits=Math.max(2,Math.ceil(Math.log2(pal.length))); const mask=bits>=32?0xffffffff:((1<<bits)-1)>>>0;
    const W=r.BlockStates.longWords; const [ax,ay,az]=A; const ox=lo[0]-mn[0],oy=lo[1]-mn[1],oz=lo[2]-mn[2];
    let i=0;
    for(let y=0;y<ay;y++)for(let z=0;z<az;z++)for(let x=0;x<ax;x++,i++){
      const b=i*bits, w=b>>>5, off=b&31;
      let v=W[w]>>>off; if(off+bits>32) v=(v|(W[w+1]<<(32-off)))>>>0; v=(v&mask)>>>0;
      const g=pal[v]; if(g) B.data[((y+oy)*B.sz+(z+oz))*B.sx+(x+ox)]=g;
    }
  }
  return B;
}
function readSponge(root){
  const s=root.Schematic||root;
  const W=s.Width&0xffff,H=s.Height&0xffff,L=s.Length&0xffff;
  let pal,data;
  if(s.Blocks&&s.Blocks.Palette){pal=s.Blocks.Palette;data=s.Blocks.Data;} else {pal=s.Palette;data=s.BlockData;}
  if(!pal||!data) throw E('errSchemFormat');
  const B=makeBuilder(W,H,L); const lut=[];
  for(const [st,id] of Object.entries(pal)){const ps=parseState(st);lut[id]=B.id(ps.name,ps.props);}
  let p=0,i=0; const n=W*H*L;
  while(i<n&&p<data.length){let v=0,sh=0,b;do{b=data[p++];v|=(b&127)<<sh;sh+=7;}while(b&128);B.data[i++]=lut[v]||0;}
  return B;
}
function readStructure(root){
  const [sx,sy,sz]=root.size; const B=makeBuilder(sx,sy,sz);
  const palRaw=root.palette||(root.palettes&&root.palettes[0]); if(!palRaw) throw E('errSchemFormat');
  const pal=palRaw.map(e=>B.id(e.Name,e.Properties||{}));
  for(const b of root.blocks){const [x,y,z]=b.pos;B.data[(y*sz+z)*sx+x]=pal[b.state];}
  return B;
}
function readSchematicBytes(u8){
  const root=parseNBT(gunzipMaybe(u8));
  if(root.Regions) return readLitematic(root);
  if(root.Schematic||root.BlockData||(root.Palette&&root.Width)) return readSponge(root);
  if(root.blocks&&root.size) return readStructure(root);
  if(root.Blocks&&root.Materials) throw E('errOldSchem');
  throw E('errUnknown');
}

/* ---- Blöcke zu Items ---- */
const IGNORE=new Set(['air','cave_air','void_air','structure_void','piston_head','moving_piston','fire','soul_fire','nether_portal','end_portal','end_gateway','bubble_column','light','barrier','frosted_ice','jigsaw','structure_block']);
const TALL=new Set(['tall_grass','large_fern','sunflower','lilac','rose_bush','peony','pitcher_plant','tall_seagrass','small_dripleaf']);
const CROP={wheat:'wheat_seeds',carrots:'carrot',potatoes:'potato',beetroots:'beetroot_seeds',melon_stem:'melon_seeds',attached_melon_stem:'melon_seeds',pumpkin_stem:'pumpkin_seeds',attached_pumpkin_stem:'pumpkin_seeds',sweet_berry_bush:'sweet_berries',cocoa:'cocoa_beans',tripwire:'string',redstone_wire:'redstone',kelp_plant:'kelp',cave_vines:'glow_berries',cave_vines_plant:'glow_berries',twisting_vines_plant:'twisting_vines',weeping_vines_plant:'weeping_vines',bamboo_sapling:'bamboo',tall_seagrass:'seagrass',big_dripleaf_stem:'big_dripleaf',dirt_path:'dirt',farmland:'dirt',torchflower_crop:'torchflower_seeds',pitcher_crop:'pitcher_pod',powder_snow:'powder_snow_bucket'};
function itemsFor(full,p){
  let id=full.replace(/^minecraft:/,'');
  if(IGNORE.has(id)) return [];
  if(id==='water'||id==='lava') return (p.level===undefined||p.level==='0')?[['#'+id,1]]:[];
  if(p.half==='upper'&&(id.endsWith('_door')||TALL.has(id))) return [];
  if(id.endsWith('_bed')&&p.part==='head') return [];
  if(id.endsWith('_slab')&&p.type==='double') return [[id,2]];
  if(id.startsWith('potted_')) return [['flower_pot',1],[id.slice(7),1]];
  if(CROP[id]) return [[CROP[id],1]];
  id=id.replace(/_wall_hanging_sign$/,'_hanging_sign').replace(/_wall_sign$/,'_sign').replace(/_wall_banner$/,'_banner')
       .replace(/_wall_head$/,'_head').replace(/_wall_skull$/,'_skull').replace(/_wall_fan$/,'_fan');
  if(id==='wall_torch')id='torch'; else if(id==='soul_wall_torch')id='soul_torch'; else if(id==='redstone_wall_torch')id='redstone_torch';
  let n=1;
  if(id.endsWith('candle')&&p.candles) n=+p.candles;
  else if(id==='sea_pickle'&&p.pickles) n=+p.pickles;
  else if(id==='turtle_egg'&&p.eggs) n=+p.eggs;
  else if(id==='snow'&&p.layers) n=+p.layers;
  return [[id,n]];
}
function stackSize(id){ if(/_bed$/.test(id))return 1; if(/(_sign|_banner|^snowball|^egg|^ender_pearl)$/.test(id))return 16; return 64; }

/* ---- Rohstoff-Rezepte ---- */
const WOODS=['dark_oak','pale_oak','oak','spruce','birch','jungle','acacia','mangrove','cherry','bamboo','crimson','warped'];
const DYES=['light_blue','light_gray','white','orange','magenta','yellow','lime','pink','gray','cyan','purple','blue','brown','green','red','black'];
function logOf(w){return w==='bamboo'?'bamboo_block':(w==='crimson'||w==='warped')?w+'_stem':w+'_log';}
function recipe(id){
  for(const w of WOODS){
    if(!id.startsWith(w+'_')) continue;
    const r=id.slice(w.length+1), pl=w+'_planks';
    switch(r){
      case 'planks': return [[logOf(w),w==='bamboo'?0.5:0.25]];
      case 'stairs': return [[pl,1.5]]; case 'slab': return [[pl,0.5]];
      case 'fence': return [[pl,5/3]]; case 'fence_gate': return [[pl,4]];
      case 'door': return [[pl,2]]; case 'trapdoor': return [[pl,3]];
      case 'pressure_plate': return [[pl,2]]; case 'button': return [[pl,1]];
      case 'sign': return [[pl,13/6]];
      case 'wood': case 'hyphae': return [[logOf(w),4/3]];
    }
  }
  let m;
  if((m=id.match(/^stripped_(.+)_(wood|hyphae)$/))) return [[logOf(m[1]),4/3]];
  if((m=id.match(/^stripped_(.+)_(log|stem)$/))) return [[logOf(m[1]),1]];
  if((m=id.match(/^(.+)_concrete_powder$/))) return [['sand',0.5],['gravel',0.5],[m[1]+'_dye',0.125]];
  if((m=id.match(/^(.+)_concrete$/))) return [[m[1]+'_concrete_powder',1]];
  if((m=id.match(/^(.+)_carpet$/))&&DYES.includes(m[1])) return [[m[1]+'_wool',2/3]];
  if((m=id.match(/^(.+)_stained_glass_pane$/))) return [[m[1]+'_stained_glass',0.375]];
  if((m=id.match(/^(.+)_stained_glass$/))) return [['glass',1],[m[1]+'_dye',0.125]];
  if(id==='glass_pane') return [['glass',0.375]];
  if(id==='glass') return [['sand',1]];
  if((m=id.match(/^(.+)_terracotta$/))&&DYES.includes(m[1])) return [['terracotta',1],[m[1]+'_dye',0.125]];
  if((m=id.match(/^(.+)_(stairs|slab|wall)$/))){
    let b=m[1]; const f=m[2]==='slab'?0.5:1;
    if(/_brick$|_tile$/.test(b)) b+='s';
    if(b==='quartz'||b==='purpur') b+='_block';
    return [[b,f]];
  }
  const T={stone:[['cobblestone',1]],smooth_stone:[['stone',1]],stone_bricks:[['stone',1]],
    polished_andesite:[['andesite',1]],polished_diorite:[['diorite',1]],polished_granite:[['granite',1]],
    polished_deepslate:[['cobbled_deepslate',1]],deepslate_bricks:[['cobbled_deepslate',1]],deepslate_tiles:[['cobbled_deepslate',1]],
    polished_blackstone:[['blackstone',1]],polished_blackstone_bricks:[['blackstone',1]],
    polished_tuff:[['tuff',1]],tuff_bricks:[['tuff',1]],
    sandstone:[['sand',4]],smooth_sandstone:[['sandstone',1]],cut_sandstone:[['sandstone',1]],
    red_sandstone:[['red_sand',4]],smooth_red_sandstone:[['red_sandstone',1]],cut_red_sandstone:[['red_sandstone',1]],
    bricks:[['brick',4]],terracotta:[['clay',1]],mud_bricks:[['packed_mud',1]],packed_mud:[['mud',1],['wheat',1]],
    quartz_block:[['quartz',4]],smooth_quartz:[['quartz_block',1]],quartz_bricks:[['quartz_block',1]],quartz_pillar:[['quartz_block',1]],
    nether_bricks:[['nether_brick',4]],prismarine_bricks:[['prismarine_shard',9]],prismarine:[['prismarine_shard',4]],
    end_stone_bricks:[['end_stone',1]],purpur_block:[['popped_chorus_fruit',4]],
    white_wool:[['string',4]],hay_block:[['wheat',9]],bone_block:[['bone_meal',9]]};
  return T[id]||null;
}
function resolveRaw(counts){
  let cur=new Map(counts);
  for(let pass=0;pass<8;pass++){
    const next=new Map(); let changed=false;
    for(const [id,n] of cur){
      const r=id.startsWith('#')?null:recipe(id);
      if(r){changed=true;for(const [b,f] of r) next.set(b,(next.get(b)||0)+n*f);}
      else next.set(id,(next.get(id)||0)+n);
    }
    cur=next; if(!changed)break;
  }
  return cur;
}

/* ---- Form und Durchsicht für 3D ---- */
function shapeOf(full,p){
  const id=full.replace(/^minecraft:/,'');
  if(id==='water'||id==='lava') return 'liquid';
  if(/_slab$/.test(id)) return p.type==='double'?'full':(p.type==='top'?'slabT':'slabB');
  if(/_trapdoor$/.test(id)) return p.open==='true'?'post':(p.half==='top'?'trapT':'trapB');
  if(id==='snow'||/(_carpet|_pressure_plate|rail|redstone_wire|lily_pad|tripwire)$/.test(id)) return 'carpet';
  if(/(_fence|_fence_gate|_wall|_pane|iron_bars|_door|chain|end_rod|lightning_rod)$/.test(id)) return 'post';
  if(/(torch|lantern|flower_pot|^potted_|candle|sapling|tulip|dandelion|poppy|orchid|allium|bluet|daisy|cornflower|lily_of_the_valley|wither_rose|torchflower|mushroom$|fern$|short_grass|^grass$|tall_grass|dead_bush|_button$|sea_pickle|_head$|_skull$|amethyst_cluster|_bud$|sweet_berry|wheat|carrots|potatoes|beetroots|^bamboo$|sugar_cane|kelp|seagrass|cobweb|ladder|vine|lever|_sign$|_banner$|brewing_stand|^bell$|_coral$|_coral_fan$|_fan$|azalea$|sunflower|lilac|rose_bush|peony|dripleaf|spore_blossom|hanging_roots|glow_lichen|sculk_vein|pink_petals|wildflowers|leaf_litter|frogspawn|turtle_egg|_crop$|_stem$|nether_sprouts|crimson_roots|warped_roots|fungus$)/.test(id)) return 'small';
  return 'full';
}

function rgbFor(full){
  const id=full.replace(/^minecraft:/,'').replace(/^#/,'');

    if(id.startsWith(d+'_')&&/(concrete|wool|carpet|terracotta|stained_glass|glazed|bed|banner|candle|shulker)/.test(id)){

  for(const [k,c] of KEYS) if(id.includes(k)) return c;

  const hue=h%360,s=.25,l=.5; const f=n=>{const k=(n+hue/30)%12;const a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};

/* ---- Textur-Namen aus der Minecraft-Datei ---- */
function texBase(full){
  let id=full.replace(/^minecraft:/,'').replace(/^#/,'').replace(/^waxed_/,'');
  const SPECIAL={smooth_quartz:'quartz_block_bottom',smooth_sandstone:'sandstone_top',smooth_red_sandstone:'red_sandstone_top',water:'water_still',lava:'lava_still',quartz:'quartz_block',purpur:'purpur_block',petrified_oak:'oak_planks',snow_block:'snow',moss:'moss_block',bamboo_block:'bamboo_block'};
  let m;
  if((m=id.match(/^(.+)_carpet$/))) id=m[1]==='moss'?'moss_block':m[1]+'_wool';
  else if((m=id.match(/^(.+)_(stairs|slab|wall)$/))){ let b=m[1]; if(WOODS.includes(b)) b+='_planks'; else if(/_brick$|_tile$/.test(b)) b+='s'; id=b; }
  else if((m=id.match(/^(.+?)(_wall)?_hanging_sign$/))&&WOODS.includes(m[1])) id=m[1]==='bamboo'?'stripped_bamboo_block':/^(crimson|warped)$/.test(m[1])?'stripped_'+m[1]+'_stem':'stripped_'+m[1]+'_log';
  else if((m=id.match(/^(.+?)(_wall)?_sign$/))&&WOODS.includes(m[1])) id=m[1]+'_planks';
  else if((m=id.match(/^(.+?)_(fence_gate|fence|pressure_plate|button)$/))&&WOODS.includes(m[1])) id=m[1]+'_planks';
  else if((m=id.match(/^(stripped_)?(.+)_(wood|hyphae)$/))) id=(m[1]||'')+m[2]+(m[3]==='wood'?'_log':'_stem');
  else if((m=id.match(/^(.+)_(fence|wall)$/))) id=m[1]+(/_brick$/.test(m[1])?'s':'');
  else if((m=id.match(/^potted_(.+)$/))) id=m[1];
  else if((m=id.match(/^(.+?)(_wall)?_banner$/))) id=m[1]+'_wool';
  else if((m=id.match(/^(.+?)_bed$/))) id=m[1]+'_wool';
  else if(/^(trapped_)?chest$/.test(id)) id='oak_planks';
  else if(id==='ender_chest') id='obsidian';
  else if(id==='decorated_pot') id='terracotta';
  if(SPECIAL[id]) id=SPECIAL[id];
  return id;
}
function resolveFaces(full,has){
  const b=texBase(full);
  if(b==='grass_block') return {top:'grass_block_top',side:'grass_block_side',bottom:'dirt'};
  if(b==='dirt_path') return {top:'dirt_path_top',side:'dirt_path_side',bottom:'dirt'};
  const pick=(...c)=>c.find(n=>n&&has(n))||null;
  const side=pick(b+'_side',b,b+'_front',b+'_stage7',b+'_stage3',b+'_bottom');
  const top=pick(b+'_top',b,side);
  const bottom=pick(b+'_bottom',b+'_top',b,side);
  if(!side&&!top) return null;
  return {top:top||side,side:side||top,bottom:bottom||top||side};
}
function tintFor(tex){
  if(tex==='grass_block_top'||/^(short_grass|grass|bush|tall_grass_(top|bottom)|fern|large_fern_(top|bottom)|vine|lily_pad|sugar_cane)$/.test(tex)) return [124,189,107];
  if(tex==='spruce_leaves') return [97,153,97];
  if(tex==='birch_leaves') return [128,167,85];
  if(/^(oak|jungle|acacia|dark_oak|mangrove)_leaves$/.test(tex)) return [89,174,48];
  if(tex==='water_still'||tex==='water_flow') return [63,118,228];
  return null;
}

const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString(loc());
const escapeHtml=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let NAMES=null; // englische Namen aus en_us.json
function pretty(id){
  if(id==='#water') return (NAMES&&NAMES['block.minecraft.water'])||'Water';
  if(id==='#lava') return (NAMES&&NAMES['block.minecraft.lava'])||'Lava';
  const k=id.replace(/^minecraft:/,'');
  if(NAMES){const n=NAMES['block.minecraft.'+k]||NAMES['item.minecraft.'+k]; if(n) return n;}
  return k.split('_').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');
}
const stacksTxt=(n,id)=>{const s=stackSize(id||'');return t('stk',Math.floor(n/s),n%s);};
const shulkTxt=(n,id)=>{const v=n/(stackSize(id||'')*27);return v<0.05?'–':v.toLocaleString(loc(),{maximumFractionDigits:1,minimumFractionDigits:1});};

/* ---- Texturen (IndexedDB) ---- */
const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('blockplan',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error);});},
  async get(k){try{const db=this.db||await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null;}},
  async set(k,v){try{const db=this.db||await this.open();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}},
  async del(k){try{const db=this.db||await this.open();await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=res;});}catch(e){}}};
let TEX=null, TEXSRC='';
const texCanvas=new Map(); // Name -> 16x16 Canvas (getönt)
const texURL=new Map();
const hasTex=n=>!!(TEX&&TEX[n]);
async function getTexCanvas(name){
  if(texCanvas.has(name)) return texCanvas.get(name);
  let c=null;
  try{
    const bmp=await createImageBitmap(TEX[name]);
    const w=bmp.width, h=Math.min(bmp.height,bmp.width);
    c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.drawImage(bmp,0,0,w,h,0,0,w,h);
    const tint=tintFor(name);
    if(tint){const im=x.getImageData(0,0,w,h);const d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i]*tint[0]/255;d[i+1]=d[i+1]*tint[1]/255;d[i+2]=d[i+2]*tint[2]/255;}x.putImageData(im,0,0);}
    c.avg=avgOf(x,w,h);
  }catch(e){c=null;}
  texCanvas.set(name,c); return c;
}
function avgOf(x,w,h){const d=x.getImageData(0,0,w,h).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<40)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}return n?[Math.round(r/n),Math.round(g/n),Math.round(b/n)]:null;}
async function faceCanvases(id){
  if(!TEX) return null;
  const f=resolveFaces(id,hasTex); if(!f) return null;
  const [top,side,bottom]=await Promise.all([getTexCanvas(f.top),getTexCanvas(f.side),getTexCanvas(f.bottom)]);
  if(!top&&!side) return null;
  return {top:top||side,side:side||top,bottom:bottom||top||side};
}
function urlOf(c){ if(!c) return null; if(!texURL.has(c)) texURL.set(c,c.toDataURL()); return texURL.get(c); }

async function loadJar(file,srcName){
  setTexBusy(true);
  try{
    const zip=await JSZip.loadAsync(file);
    const tex={}, jobs=[], bs={}, md={};
    zip.forEach((path,entry)=>{ if(entry.dir) return;
      let m=path.match(/^assets\/minecraft\/textures\/block\/([a-z0-9_]+)\.png$/);
      if(m){ jobs.push(entry.async('uint8array').then(u=>{tex[m[1]]=new Blob([u],{type:'image/png'});})); return; }
      m=path.match(/^assets\/minecraft\/blockstates\/([a-z0-9_]+)\.json$/);
      if(m){ jobs.push(entry.async('string').then(t=>{try{bs[m[1]]=JSON.parse(t);}catch(e){}})); return; }
      m=path.match(/^assets\/minecraft\/models\/block\/([a-z0-9_\/]+)\.json$/);
      if(m){ jobs.push(entry.async('string').then(t=>{try{md[m[1]]=JSON.parse(t);}catch(e){}})); }
    });
    await Promise.all(jobs);
    if(Object.keys(bs).length&&Object.keys(md).length){ MODELS={bs,md}; modelCache.clear(); await idb.set('models',MODELS); }
    const lf=zip.file('assets/minecraft/lang/en_us.json'); let names=null;
    if(lf){try{const j=JSON.parse(await lf.async('string'));names={};for(const k in j) if(/^(block|item)\.minecraft\.[a-z0-9_]+$/.test(k)) names[k]=j[k];}catch(e){}}
    if(!Object.keys(tex).length) throw new Error(t('texNoFiles'));
    TEX=Object.assign({},TEX||{},tex); TEXSRC=srcName||file.name; rawCanvas.clear(); if(names) NAMES=Object.assign({},NAMES||{},names);
    texCanvas.clear(); texURL.clear();
    await idb.set('tex',TEX); await idb.set('texsrc',TEXSRC); if(NAMES) await idb.set('names',NAMES);
    await afterTexturesChanged();
  }catch(err){ $('#texState').innerHTML=`<span class="err">${escapeHtml(err.message||String(err))}</span>`; console.error(err); }
  setTexBusy(false);
}
function setTexBusy(b){ $('#jarBtn').disabled=b; if(b) $('#texState').textContent=t('texReading'); else renderTexState(); }
function renderTexState(){
  const n=TEX?Object.keys(TEX).length:0;
  $('#texDot').classList.toggle('on',n>0); $('#texClear').hidden=!n;
  if(!$('#jarBtn').disabled) $('#texState').textContent='· '+(n?t('texOn',fmt(n),TEXSRC)+(MODELS?'':' · '+t('texNoModels')):t('texNone'));
}
async function afterTexturesChanged(){
  renderTexState();
  if(!S) return;
  await prepareSwatches();
  if(S.grid) await refreshPaletteTextures();
  renderAll(); if(V3.ready) build3D();
}
async function prepareSwatches(){
  S.sw={};
  if(!TEX) return;
  const ids=[...S.counts.keys(),...resolveRaw(S.counts).keys()];
  for(const id of ids){ if(S.sw[id]!==undefined) continue; const f=await faceCanvases(id); S.sw[id]=f?urlOf(f.top):null; }
}
async function refreshPaletteTextures(){
  const pal=S.grid.palette; S.faces=[];
  for(let i=0;i<pal.length;i++){
    if(!S.renderable[i]) {S.faces[i]=null;continue;}
    let f=await faceCanvases(pal[i].name);
    if(f&&isCross(pal[i].name)){ const cn=crossTexName(pal[i].name,pal[i].props,hasTex); f=Object.assign({},f,{cross:(cn&&await getTexCanvas(cn))||f.side}); }
    S.faces[i]=f;
    S.rgb[i]=(f&&(f.top.avg||f.side.avg))||rgbFor(pal[i].name);
  }
}

/* ---- Zustand ---- */
let S=null;
function swatchHtml(id){
  const u=S&&S.sw&&S.sw[id];
  if(u) return `<span class="sw" style="background-image:url(${u})"></span>`;
  const c=rgbFor(id); return `<span class="sw" style="background:rgb(${c[0]},${c[1]},${c[2]})"></span>`;
}
const RENAMES={'minecraft:chain':'minecraft:iron_chain','minecraft:grass':'minecraft:short_grass'};
async function loadGrid(B,label,labelKey,isExample){
  const pal=B.palette; for(const e of pal){ const r=RENAMES[e.name]; if(r) e.name=r; }
  const occ=new Float64Array(pal.length);
  for(let i=0;i<B.data.length;i++) occ[B.data[i]]++;
  const counts=new Map(); const weight=new Float64Array(pal.length); const itemsPer=[]; const renderable=[];
  pal.forEach((e,i)=>{const it=itemsFor(e.name,e.props);itemsPer[i]=it; renderable[i]=i>0&&!IGNORE.has(e.name.replace(/^minecraft:/,''));
    for(const [id,n] of it){if(!occ[i])continue;counts.set(id,(counts.get(id)||0)+n*occ[i]);if(!id.startsWith('#'))weight[i]+=n;}});
  const layerW=new Float64Array(B.sy); const L=B.sx*B.sz;
  for(let y=0;y<B.sy;y++){let s=0;const o=y*L;for(let i=0;i<L;i++)s+=weight[B.data[o+i]];layerW[y]=s;}
  let minY=0,maxY=B.sy-1; while(minY<B.sy-1&&!layerW[minY])minY++; while(maxY>minY&&!layerW[maxY])maxY--;
  S={label,labelKey,isExample,grid:B,counts,itemsPer,renderable,rgb:pal.map(e=>rgbFor(e.name)),faces:[],layerW,minY,maxY,layer:minY,cut:maxY,sw:{}};
  initState();
  await prepareSwatches(); if(TEX) await refreshPaletteTextures();
  renderAll(); reset3D(); if(!$('#panel-d3').hidden) build3D();
  await objLoad();
}
async function loadList(counts,label){
  S={label,isExample:false,grid:null,counts,layerW:null,sw:{}}; initState(); await prepareSwatches(); renderAll(); reset3D(); if(!$('#panel-d3').hidden) build3D(); await objLoad();
}
function initState(){
  let total=0; for(const [id,n] of S.counts) if(!id.startsWith('#')) total+=n;
  S.total=total; S.key='blockplan:'+(S.labelKey||S.label)+':'+total;
  const saved=store.get(S.key)||{}; S.have=saved.have||{}; S.built=saved.built||{}; S.off=Object.assign({x:0,y:0,z:0},store.get(S.key+':off')||{});
}
function save(){ if(S) store.set(S.key,{have:S.have,built:S.built}); }
let statusExtra='';
function setStatus(html,isErr){ $('#status').innerHTML=isErr?`<span class="err">${html}</span>`:html; }

function renderAll(){
  const items=[...S.counts.entries()].filter(([id])=>!id.startsWith('#')).sort((a,b)=>b[1]-a[1]);
  S.items=items;
  const tag=S.isExample?`<span class="badge example">${t('example')}</span>`:`<span class="badge">${t('loaded')}</span>`;
  const label=S.labelKey?t(S.labelKey,S.labelArg):S.label;
  setStatus(`${tag} <span class="file-name">${escapeHtml(label)}</span>${statusExtra}`);
  const g=S.grid; const stacks=items.reduce((a,[id,n])=>a+Math.ceil(n/stackSize(id)),0);
  const cells=[[t('stBlocks'),fmt(S.total),t('stBlocksS')],[t('stTypes'),fmt(items.length),t('stTypesS')],[t('stStacks'),fmt(stacks),t('stStacksS')],
    [t('stShulk'),(stacks/27).toLocaleString(loc(),{maximumFractionDigits:1}),t('stShulkS')]];
  if(g) cells.push([t('stSize'),`${g.sx} × ${g.sy} × ${g.sz}`,t('stSizeS')]);
  $('#stats').innerHTML=cells.map(([k,v,s])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  renderMat(); renderRaw(); renderLayers(); renderProgress();
}
function renderMat(){
  const q=$('#q').value.trim().toLowerCase(); const hide=$('#hideDone').checked;
  const rows=[];
  for(const [id,n] of S.items){
    const nm=pretty(id); if(q&&!nm.toLowerCase().includes(q)&&!id.includes(q))continue;
    const h=Math.min(+S.have[id]||0,n); const done=h>=n;
    if(hide&&done)continue;
    rows.push(`<tr class="${done?'done':''}" data-id="${id}"><td class="name">${swatchHtml(id)}<span class="nm">${escapeHtml(nm)}</span></td>
      <td class="num">${fmt(n)}</td><td class="num">${stacksTxt(n,id)}</td><td class="num">${shulkTxt(n,id)}</td>
      <td class="num"><input class="have" id="have-${id}" type="number" min="0" inputmode="numeric" value="${S.have[id]||''}" placeholder="0" aria-label="${escapeHtml(t('thHave')+' '+nm)}"></td>
      <td>${stateCell(h,n)}</td></tr>`);
  }
  $('#matBody').innerHTML=rows.join('')||`<tr><td colspan="6" class="empty">${t('noHits')}</td></tr>`;
  const notes=[];
  for(const k of ['#water','#lava']) if(S.counts.get(k)) notes.push(t('liquid',pretty(k),fmt(S.counts.get(k))));
  $('#matNote').textContent=notes.join(' ');
}
const stateCell=(h,n)=>h>=n?`<span class="chk">${t('done')}</span>`:`<span class="mini"><i style="width:${(h/n*100).toFixed(1)}%"></i></span>`;
function renderRaw(){
  const raw=[...resolveRaw(S.counts).entries()].filter(([id])=>!id.startsWith('#')).map(([id,n])=>[id,Math.ceil(n-1e-9)]).sort((a,b)=>b[1]-a[1]);
  $('#rawBody').innerHTML=raw.map(([id,n])=>`<tr><td class="name">${swatchHtml(id)}${escapeHtml(pretty(id))}</td><td class="num">${fmt(n)}</td><td class="num">${stacksTxt(n,id)}</td><td class="num">${shulkTxt(n,id)}</td></tr>`).join('');
}
function renderProgress(){
  let need=0,have=0; for(const [id,n] of S.items){need+=n;have+=Math.min(+S.have[id]||0,n);}
  const pm=need?have/need:0;
  $('#pMat').textContent=Math.floor(pm*100)+' %'; $('#pMatBar').style.width=(pm*100)+'%';
  $('#pMatTxt').textContent=t('progMatTxt',fmt(have),fmt(need));
  if(S.layerW){let tot=0,b=0,nb=0;for(let y=S.minY;y<=S.maxY;y++){tot+=S.layerW[y];if(S.built[y]){b+=S.layerW[y];nb++;}}
    const pb=tot?b/tot:0;
    $('#pBuild').textContent=Math.floor(pb*100)+' %'; $('#pBuildBar').style.width=(pb*100)+'%';
    $('#pBuildTxt').textContent=nb?t('progBuildTxt',nb,S.maxY-S.minY+1):t('progBuildHint');
    store.set(S.key+':pct',{m:pm,b:pb});
  } else {$('#pBuild').textContent='–';$('#pBuildBar').style.width='0';$('#pBuildTxt').textContent=t('progBuildNa');store.set(S.key+':pct',{m:pm,b:null});}
  if(S.buildId) renderBuilds();
}

/* ---- Meine Builds (IndexedDB) ---- */
let BUILDS=[];
async function initBuilds(){ BUILDS=(await idb.get('builds'))||[]; renderBuilds(); }
async function saveBuild(entry){
  const i=BUILDS.findIndex(b=>b.name===entry.name&&b.total===entry.total&&b.kind===entry.kind);
  if(i>=0){ entry.id=BUILDS[i].id; BUILDS.splice(i,1); }
  entry.date=Date.now(); BUILDS.unshift(entry); S.buildId=entry.id;

    el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; last={x:e.clientX,y:e.clientY};

function tick(){

function pick3D(e){ const r=V3.renderer.domElement.getBoundingClientRect(); pickAt(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1)); }
function pickAt(ndc){
  const tip=$('#tip3d'); if(!V3.ready){tip.hidden=true;return;}
  const g=S.grid, dir=new THREE.Vector3(ndc.x,ndc.y,.5).unproject(V3.cam).sub(V3.cam.position).normalize();
  const hit=castRay(V3.cam.position.x+g.sx/2,V3.cam.position.y,V3.cam.position.z+g.sz/2,dir.x,dir.y,dir.z);
  if(!hit){tip.hidden=true;return;}
  const w=wpos(hit.x,hit.y,hit.z); tip.textContent=`${pretty(g.palette[hit.a].name)} · X ${w[0]} Y ${w[1]} Z ${w[2]}`; tip.hidden=false;
}
function castRay(ox,oy,oz,dx,dy,dz){
  const g=S.grid, SX=g.sx, SY=Math.min(g.sy,S.cut+1), SZ=g.sz, K=P3.kind, D=g.data;
  let t0=0,t1=Infinity;
  for(const [o,d,mx] of [[ox,dx,SX],[oy,dy,SY],[oz,dz,SZ]]){
    if(Math.abs(d)<1e-9){ if(o<0||o>mx) return null; continue; }
    let a=(0-o)/d, b=(mx-o)/d; if(a>b)[a,b]=[b,a]; t0=Math.max(t0,a); t1=Math.min(t1,b);
  }
  if(t0>t1) return null;
  const e=t0+1e-6; let x=Math.floor(ox+dx*e), y=Math.floor(oy+dy*e), z=Math.floor(oz+dz*e);
  const sx=dx>0?1:-1, sy=dy>0?1:-1, sz=dz>0?1:-1;
  const nx=x+(sx>0?1:0), ny=y+(sy>0?1:0), nz=z+(sz>0?1:0);
  let tx=Math.abs(dx)<1e-9?Infinity:(nx-ox)/dx, ty=Math.abs(dy)<1e-9?Infinity:(ny-oy)/dy, tz=Math.abs(dz)<1e-9?Infinity:(nz-oz)/dz;
  const ddx=Math.abs(1/dx), ddy=Math.abs(1/dy), ddz=Math.abs(1/dz);
  for(let i=0;i<SX+SY+SZ+3;i++){
    if(x>=0&&y>=0&&z>=0&&x<SX&&y<SY&&z<SZ){ const a=D[(y*g.sz+z)*SX+x]; if(K[a]) return {x,y,z,a}; }
    else if(i>2) return null;
    if(tx<ty&&tx<tz){x+=sx;tx+=ddx;} else if(ty<tz){y+=sy;ty+=ddy;} else {z+=sz;tz+=ddz;}
  }
  return null;
}

/* ---- Liste einfügen ---- */
function parseList(txt){
  const m=new Map(); let bad=0;
  for(let line of txt.split(/\r?\n/)){
    line=line.trim(); if(!line)continue;
    const r=line.match(/^(.*?[A-Za-zÄÖÜäöüß)])\s*[-–:x×=]?\s*([\d][\d.,' ]*)\s*$/) || line.match(/^([\d][\d.,' ]*)\s*[x×]?\s*(.+)$/);
    if(!r){bad++;continue;}
    let name,num; if(/^\d/.test(r[1])){num=r[1];name=r[2];}else{name=r[1];num=r[2];}
    const n=parseInt(num.replace(/[.,' ]/g,''),10); if(!n){bad++;continue;}
    let id=name.trim().toLowerCase().replace(/[^a-z0-9äöüß]+/g,'_').replace(/^_|_$/g,'');
    if(NAMES){const want=name.trim().toLowerCase();for(const k in NAMES){if(NAMES[k].toLowerCase()===want){id=k.replace(/^(block|item)\.minecraft\./,'');break;}}}
    m.set(id,(m.get(id)||0)+n);
  }
  return {m,bad};
}

};

/* ---- Welt laden (Region-Dateien .mca) ---- */
function worldBox(){
  const v=id=>{const x=parseInt($(id).value,10); return Number.isFinite(x)?x:null;};
  const a=[v('#wX1'),v('#wX2'),v('#wZ1'),v('#wZ2'),v('#wY1'),v('#wY2')]; if(a.some(x=>x===null)) return null;
  const [x1,x2,z1,z2,y1,y2]=a;
  return {x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),y1:Math.max(-64,Math.min(y1,y2)),y2:Math.min(319,Math.max(y1,y2))};
}
function regionNames(b){ const out=[]; for(let rz=Math.floor(b.z1/512);rz<=Math.floor(b.z2/512);rz++) for(let rx=Math.floor(b.x1/512);rx<=Math.floor(b.x2/512);rx++) out.push(`r.${rx}.${rz}.mca`); return out; }
function updateWorldNeed(){
  const b=worldBox(), el=$('#wNeed');
  try{ store.set('blockplan:wbox',['#wX1','#wX2','#wZ1','#wZ2','#wY1','#wY2'].map(i=>$(i).value)); }catch(e){}
  if(!b){ el.textContent=t('wNeedCoords'); return; }
  const sx=b.x2-b.x1+1, sy=b.y2-b.y1+1, sz=b.z2-b.z1+1, cells=sx*sy*sz;
  el.textContent=t('wNeedFiles',`${sx} × ${sy} × ${sz}`,regionNames(b).join(', '))+(cells>260e6?' · '+t('errTooBig',`${sx}×${sy}×${sz}`):'');
}
function longVal(W,k,bits,per,mask){
  const l=Math.floor(k/per), off=(k-l*per)*bits, lo=W[2*l], hi=W[2*l+1];
  if(off+bits<=32) return (lo>>>off)&mask;
  if(off>=32) return (hi>>>(off-32))&mask;
  return ((lo>>>off)|(hi<<(32-off)))&mask;
}
async function loadWorld(files){
  const b=worldBox(), msg=$('#wMsg');

  const names=regionNames(b), have=names.filter(n=>byName.has(n));
  if(!have.length){ msg.className='err'; msg.textContent=t('wNoFiles',names.join(', ')); return; }
  msg.className='muted'; msg.textContent=t('wReading',0);
  try{
    const sx=b.x2-b.x1+1, sy=b.y2-b.y1+1, sz=b.z2-b.z1+1, B=makeBuilder(sx,sy,sz);
    let done=0, total=0, skipped=0, t0=performance.now();
    for(const n of have){ const [rx,rz]=n.split('.').slice(1,3).map(Number);
      total+=(Math.min(b.x2>>4,rx*32+31)-Math.max(b.x1>>4,rx*32)+1)*(Math.min(b.z2>>4,rz*32+31)-Math.max(b.z1>>4,rz*32)+1); }
    for(const n of have){
      const [rx,rz]=n.split('.').slice(1,3).map(Number);
      const buf=new Uint8Array(await byName.get(n).arrayBuffer()), dv=new DataView(buf.buffer);

}

/* ---- Baupläne: Objekte und gleiche Kopien finden (auch gedreht/gespiegelt) ---- */
const AIR_RE=/(^|:)(air|cave_air|void_air)$/;
function objNameIds(pal){
  const m=new Map(), ids=new Int32Array(pal.length);
  pal.forEach((e,i)=>{ const n=(typeof e==='string'?e:e.name).split('[')[0]; if(i===0||AIR_RE.test(n)){ids[i]=-1;return;} if(!m.has(n)) m.set(n,m.size); ids[i]=m.get(n); });

/* Lage im Zielkasten: m spiegelt x, r dreht im Uhrzeigersinn (von oben) */
function tfXZ(x,z,w,d,r,m){ if(m) x=w-1-x; switch(r){case 0:return[x,z];case 1:return[d-1-z,x];case 2:return[w-1-x,d-1-z];default:return[z,w-1-x];} }
function objPalCounts(G){
  if(G.pc) return G.pc; const pc=new Float64Array(G.ids.length), D=G.D;
  for(let i=0;i<D.length;i++) pc[D[i]]++;
  G.pc=pc; return pc;
}
function objNameCounts(G){
  if(G.nc) return G.nc; const pc=objPalCounts(G), nc=new Float64Array(G.nIds);
  for(let a=0;a<pc.length;a++) if(G.ids[a]>=0) nc[G.ids[a]]+=pc[a];

}
/* Kasten b=[x0,y0,z0,x1,y1,z1) im Gitter G={D,sx,sy,sz,ids,nIds}. Liefert alle Stellen mit gleichem Inhalt. */
async function findCopies(G,b,tol,onProg){
  tol=tol==null?0.04:tol;
  const [x0,y0,z0,x1,y1,z1]=b, w=x1-x0,h=y1-y0,d=z1-z0, {D,sx,sy,sz,ids}=G;
  const cx=[],cy=[],cz=[],ci=[];
  for(let y=0;y<h;y++)for(let z=0;z<d;z++)for(let x=0;x<w;x++){ const id=ids[D[((y0+y)*sz+(z0+z))*sx+x0+x]]; if(id>=0){cx.push(x);cy.push(y);cz.push(z);ci.push(id);} }
  const N=ci.length; if(!N) return [];
  // verstreute Prüfreihenfolge, damit Fehlstellen früh auffallen
  const ord=[...Array(N).keys()]; let s=12345; for(let i=N-1;i>0;i--){ s=(s*1103515245+12345)>>>0; const j=s%(i+1); [ord[i],ord[j]]=[ord[j],ord[i]]; }
  const nc=objNameCounts(G); let k0=0; for(let k=1;k<N;k++) if(nc[ci[k]]<nc[ci[k0]]) k0=k;
  const aid=ci[k0], aMask=new Uint8Array(ids.length); for(let a=0;a<ids.length;a++) if(ids[a]===aid) aMask[a]=1;
  const maxBad=Math.floor(N*tol), best=new Map(), plane=sx*sz;
  for(let i=0;i<D.length;i++){
    if((i&0xffffff)===0&&onProg){ await onProg(i/D.length); }
    if(!aMask[D[i]]) continue;
    const py=(i/plane)|0, rem=i-py*plane, pz=(rem/sx)|0, px=rem-pz*sx;
    for(let m=0;m<2;m++) for(let r=0;r<4;r++){
      const W=(r&1)?d:w, DD=(r&1)?w:d, [ax,az]=tfXZ(cx[k0],cz[k0],w,d,r,m);
      const ox=px-ax, oy=py-cy[k0], oz=pz-az;
      if(ox<0||oy<0||oz<0||ox+W>sx||oy+h>sy||oz+DD>sz) continue;
      const key=ox+','+oy+','+oz+','+W+','+DD; const prev=best.get(key); if(prev&&prev.diff===0) continue;
      let bad=0;
      for(let q=0;q<N;q++){ const k=ord[q], t=tfXZ(cx[k],cz[k],w,d,r,m);
        if(ids[D[((oy+cy[k])*sz+(oz+t[1]))*sx+ox+t[0]]]!==ci[k]&&++bad>maxBad) break; }
      if(bad<=maxBad&&(!prev||bad<prev.diff)) best.set(key,{b:[ox,oy,oz,ox+W,oy+h,oz+DD],r,m,diff:bad,n:N});
    }
  }
  // überlappende Treffer: nur den besten behalten
  const res=[...best.values()].sort((a,b)=>a.diff-b.diff), out=[];
  const ov=(a,b)=>{ const ix=Math.min(a[3],b[3])-Math.max(a[0],b[0]), iy=Math.min(a[4],b[4])-Math.max(a[1],b[1]), iz=Math.min(a[5],b[5])-Math.max(a[2],b[2]); if(ix<=0||iy<=0||iz<=0) return 0; return ix*iy*iz/((a[3]-a[0])*(a[4]-a[1])*(a[5]-a[2])); };
  for(const c of res) if(!out.some(o=>ov(o.b,c.b)>.3)) out.push(c);
  return out.sort((a,b)=>a.b[2]-b.b[2]||a.b[0]-b.b[0]||a.b[1]-b.b[1]);
}

function objFitY(G,b){
  const {D,sx,sz,sy,ids}=G; let [x0,y0,z0,x1,y1,z1]=b;
  const empty=y=>{ for(let z=z0;z<z1;z++)for(let x=x0;x<x1;x++) if(ids[D[(y*sz+z)*sx+x]]>=0) return false; return true; };
  while(y1<sy&&!empty(y1)) y1++;

}
/* Kasten seitlich wachsen lassen, solange direkt angrenzende Blöcke dazugehören (höchstens m Schritte je Seite) */
function objGrow(G,b,m){
  const {D,sx,sz,ids}=G; let [x0,y0,z0,x1,y1,z1]=b;
  const solid=(x,y,z)=>ids[D[(y*sz+z)*sx+x]]>=0;
  for(let step=0;step<m;step++){
    let grew=false;
    const touch=(fx,fz,nx,nz)=>{ for(let y=y0;y<y1;y++) if(solid(fx,y,fz)&&solid(nx,y,nz)) return true; return false; };
    if(x0>0){ let t=false; for(let z=z0;z<z1&&!t;z++) t=touch(x0,z,x0-1,z); if(t){x0--;grew=true;} }
    if(x1<sx){ let t=false; for(let z=z0;z<z1&&!t;z++) t=touch(x1-1,z,x1,z); if(t){x1++;grew=true;} }
    if(z0>0){ let t=false; for(let x=x0;x<x1&&!t;x++) t=touch(x,z0,x,z0-1); if(t){z0--;grew=true;} }
    if(z1<sz){ let t=false; for(let x=x0;x<x1&&!t;x++) t=touch(x,z1-1,x,z1); if(t){z1++;grew=true;} }
    if(!grew) break;

    const [dx,dz]=dir; c.beginPath(); c.moveTo(cx+dx*r,cz+dz*r); c.lineTo(cx-dz*r*.6-dx*r*.4,cz+dx*r*.6-dz*r*.4); c.lineTo(cx+dz*r*.6-dx*r*.4,cz-dx*r*.6-dz*r*.4); c.closePath(); c.fill(); c.stroke();

    const r=await lvFetch('/api/assets'); if(!r.ok) return;
    await loadJar(await r.blob(),src);
  }catch(e){}
}
async function liveLoadPlan(){
  const u8=new Uint8Array(await (await lvFetch('/api/plan')).arrayBuffer());
  const {B,name}=decodePlan(u8); statusExtra='';
  await loadGrid(B,name,null,false); applyAnchor(); computeReqIdx(); LV.ver=-1;
}
function applyAnchor(){
  const a=LV.state&&LV.state.anchor; if(!a||!S||!S.grid) return;
  S.off={x:a.x,y:a.y,z:a.z,rot:a.rot}; renderLayers(); if(V3.ready) render3D();
}
async function livePoll(){
  try{
    const st=await (await lvFetch('/api/state')).json(); LV.fail=0;
    const ancChanged=JSON.stringify(st.anchor)!==JSON.stringify(LV.state&&LV.state.anchor);
    LV.state=st; if(ancChanged) applyAnchor();
    if(st.plan&&S&&S.grid&&LV.reqIdx&&LV.reqIdx.length===st.plan.req&&st.version!==LV.ver){
      const r=await lvFetch('/api/status'); const v=+r.headers.get('X-Version');
      if(v!==LV.ver){ const b=new Uint8Array(await r.arrayBuffer()); if(b.length){ LV.status=pako.inflate(b); LV.ver=v; PV.baseKey=''; reqPlan(); } }
      LV.wrong=await (await lvFetch('/api/wrong')).json();
    }
  }catch(e){ LV.fail++; }
  liveRender();
}
function liveRender(){
  const st=LV.state||{}, ok=LV.fail<3;
  $('#lvDot').classList.toggle('on',ok); $('#lvState').textContent='· '+(ok?t('lvOn'):t('lvOff'));
  $('#lvPlan').textContent=st.plan?t('lvPlanInfo',st.plan.name,`${st.plan.sx} × ${st.plan.sy} × ${st.plan.sz}`,fmt(st.plan.req)):t('lvNoPlan');
  const a=st.anchor;
  for(const [id,k] of [['#anX','x'],['#anY','y'],['#anZ','z']]) if(document.activeElement!==$(id)) $(id).value=a?a[k]:'';
  if(document.activeElement!==$('#anR')) $('#anR').value=a?a.rot:0;
  const c=st.counts||{}, req=st.plan?st.plan.req:0, pct=req?(c.correct||0)/req*100:0;
  $('#lvCounts').innerHTML=st.plan?`<span>${t('lvCorrect')}</span><b>${fmt(c.correct||0)}</b><span>${t('lvWrongN')}</span><b style="color:var(--copper)">${fmt(c.wrong||0)}</b><span>${t('lvMissing')}</span><b>${fmt(c.missing||0)}</b><span>${t('lvUnknown')}</span><b>${fmt(c.unknown||0)}</b><span>${t('lvDone')}</span><b>${pct.toLocaleString(loc(),{maximumFractionDigits:2})} %</b>`:'';
  $('#lvPlayers').textContent=(st.players||[]).length?(st.players||[]).map(p=>`${p.name}: ${Math.floor(p.x)} ${Math.floor(p.y)} ${Math.floor(p.z)}${p.overworld?'':' ('+t('lvOtherDim')+')'}`).join(' · '):t('lvNoPlayers');
  LV.players=st.players||[];
  const w=LV.wrong||[]; $('#lvWrongBox').hidden=!w.length; $('#lvWrongSum').textContent=t('lvWrongList',fmt(c.wrong||0));
  $('#lvWrong').innerHTML=w.map(e=>`<div><span class="mono">${e.x} ${e.y} ${e.z}</span><span>${escapeHtml(e.have)} → <b>${escapeHtml(e.want)}</b></span><button class="btn small" data-cell="${e.cell}">${t('lvShow')}</button></div>`).join('');
  if(st.plan&&S&&S.grid&&LV.on&&S.livePlan!==false){
    $('#pBuild').textContent=Math.floor(pct)+' %'; $('#pBuildBar').style.width=pct+'%';
    $('#pBuildTxt').textContent=t('lvBuildTxt',fmt(c.correct||0),fmt(req),fmt(c.wrong||0));
  }
  if(!$('#panel-lay').hidden) reqPlan();
}
$('#lvWrong').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!S||!S.grid) return;
  const cell=+b.dataset.cell, g=S.grid, x=cell%g.sx, z=Math.floor(cell/g.sx)%g.sz, y=Math.floor(cell/(g.sx*g.sz));
  document.querySelector('.tab[data-tab="lay"]').click(); PV.mode='layer'; setLayer(y);
  if(!PV.zoom) fitPlan(); PV.zoom=Math.max(PV.zoom,16); PV.cx=x+.5; PV.cz=z+.5; PV.measure={a:[x,z],b:[x,z]}; reqPlan();
  $('#stage2d').scrollIntoView({behavior:'smooth',block:'center'});
});
$('#lvSend').onclick=async()=>{
  const m=$('#lvSendMsg'); if(!S||!S.grid){ m.className='err'; m.textContent=t('lvNeedGrid'); return; }
  m.className='muted'; m.textContent=t('lvSending');
  try{ await new Promise(r=>setTimeout(r,30)); const body=encodePlan();
    const r=await (await lvFetch('/api/plan',{method:'POST',body,headers:{'Content-Type':'application/octet-stream'}})).json();
    computeReqIdx(); LV.ver=-1; m.className='muted'; m.textContent=t('lvSent',fmt(r.req)); }
  catch(e){ m.className='err'; m.textContent=String(e.message||e); }
};
$('#ceGo').onclick=()=>{
  if(!S||!S.grid) return; const r=+$('#anR').value, g=S.grid, w=(r&1)?g.sz:g.sx, d=(r&1)?g.sx:g.sz;
  const cx=parseInt($('#ceX').value,10), cz=parseInt($('#ceZ').value,10); if(!Number.isFinite(cx)||!Number.isFinite(cz)) return;
  $('#anX').value=cx-Math.floor(w/2); $('#anZ').value=cz-Math.floor(d/2);
};
$('#anSave').onclick=async()=>{
  const v=id=>parseInt($(id).value,10), a={x:v('#anX'),y:v('#anY'),z:v('#anZ'),rot:+$('#anR').value}, m=$('#anMsg');
  if([a.x,a.y,a.z].some(n=>!Number.isFinite(n))){ m.className='err'; m.textContent=t('lvNeedXYZ'); return; }
  try{ await lvFetch('/api/anchor',{method:'POST',body:JSON.stringify(a)}); m.className='muted'; m.textContent=t('lvSaved'); }catch(e){ m.className='err'; m.textContent=String(e.message||e); }
};

/* ---- Beispiel: kleiner Brunnen ---- */
function sampleFountain(){
  const R=9,sx=2*R+3,sz=2*R+3,sy=14; const B=makeBuilder(sx,sy,sz); const cx=R+1,cz=R+1;
  const set=(x,y,z,n,p)=>{B.data[(y*sz+z)*sx+x]=B.id('minecraft:'+n,p||{});};
  for(let x=0;x<sx;x++)for(let z=0;z<sz;z++){
    const d=Math.hypot(x-cx,z-cz);
    if(d<=R+0.5){ set(x,0,z,(x+z)%3?'smooth_stone':'stone_bricks');
      if(d>R-0.6){ set(x,1,z,'stone_bricks'); set(x,2,z,'stone_brick_slab',{type:'bottom'}); }
      else if(d>2.6) set(x,1,z,'water',{level:'0'});
    }
    if(d<=2.5){ set(x,1,z,'polished_andesite'); set(x,2,z,'polished_andesite'); }
    if(d<=1.5){ for(let y=3;y<=9;y++) set(x,y,z,y%3===0?'polished_deepslate':'deepslate_tiles'); }
  }
  for(let x=0;x<sx;x++)for(let z=0;z<sz;z++){const d=Math.hypot(x-cx,z-cz);
    if(d<=3.5&&d>2.5){ set(x,10,z,'cobbled_deepslate_slab',{type:'top'}); set(x,11,z,'cobbled_deepslate_wall'); }
    if(d<=2.5) set(x,10,z,'polished_deepslate');
    if(d<=2.5&&d>1.5) set(x,11,z,'water',{level:'0'});
  }
  set(cx,11,cz,'lantern'); set(cx,12,cz,'chain'); set(cx,13,cz,'chain');
  for(const [dx,dz,f] of [[0,-(R+1),'south'],[0,R+1,'north'],[-(R+1),0,'east'],[R+1,0,'west']]) set(cx+dx,0,cz+dz,'stone_brick_stairs',{facing:f,half:'bottom'});
  return B;
}
function loadSample(){ statusExtra=''; return loadGrid(sampleFountain(),'sample','sampleName',true); }
$('#sampleBtn').onclick=loadSample;

  renderTexState();

})();
